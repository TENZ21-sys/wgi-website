<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="slopeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="bedrockGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="slideZoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
  </defs>

  <!-- Sky Background -->
  <rect width="800" height="480" fill="url(#skyGrad)" rx="16"/>

  <!-- Mountain Slope Silhouette -->
  <!-- Deep Bedrock Foundation -->
  <polygon points="0,480 0,220 220,130 500,260 800,320 800,480" fill="url(#bedrockGrad)"/>

  <!-- Unstable Soil / Landslide Mass -->
  <polygon points="180,180 500,220 760,340 700,380 400,280 160,210" fill="url(#slideZoneGrad)" fill-opacity="0.85" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="360" y="240" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#b45309">POTENTIAL SLIDE MASS (SOIL &amp; ROCK)</text>

  <!-- Slip Surface Curve -->
  <path d="M 160 210 Q 400 290 700 380" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="5 3" fill="none"/>
  <text x="440" y="325" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#dc2626">Critical Slip Failure Plane</text>

  <!-- Stable Bedrock GNSS Reference Base Station -->
  <g transform="translate(190, 80)">
    <!-- Tripod / Pier -->
    <line x1="20" y1="50" x2="10" y2="70" stroke="#0284c7" stroke-width="3"/>
    <line x1="20" y1="50" x2="30" y2="70" stroke="#0284c7" stroke-width="3"/>
    <rect x="15" y="45" width="10" height="10" fill="#0369a1" rx="2"/>
    <!-- GNSS Conical Antenna -->
    <path d="M 12 45 L 20 25 L 28 45 Z" fill="#0284c7"/>
    <!-- Radio Waves -->
    <path d="M 32 20 A 15 15 0 0 1 32 40" stroke="#0ea5e9" stroke-width="2" fill="none"/>
    <path d="M 38 15 A 25 25 0 0 1 38 45" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="2 2" fill="none"/>
    <!-- Label Badge -->
    <rect x="-40" y="-30" width="130" height="32" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <text x="-32" y="-17" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#0284c7">1. GNSS BASE STATION</text>
    <text x="-32" y="-5" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Anchored in Solid Bedrock</text>
  </g>

  <!-- Rover 1 (Upper Slope) -->
  <g transform="translate(320, 150)">
    <line x1="15" y1="35" x2="15" y2="55" stroke="#0f172a" stroke-width="2.5"/>
    <circle cx="15" cy="30" r="7" fill="#2563eb"/>
    <!-- Callout -->
    <rect x="-35" y="-32" width="120" height="30" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="-28" y="-19" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#1e40af">2. WIRELESS ROVER 1</text>
    <text x="-28" y="-7" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Tracks 3D Surface Creep</text>
  </g>

  <!-- Rover 2 (Lower Slope) -->
  <g transform="translate(540, 240)">
    <line x1="15" y1="35" x2="15" y2="55" stroke="#0f172a" stroke-width="2.5"/>
    <circle cx="15" cy="30" r="7" fill="#2563eb"/>
    <!-- Callout -->
    <rect x="-35" y="-32" width="120" height="30" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="-28" y="-19" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#1e40af">3. WIRELESS ROVER 2</text>
    <text x="-28" y="-7" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Detects Sudden Acceleration</text>
  </g>

  <!-- Solar 4G Gateway on Crest -->
  <g transform="translate(680, 160)">
    <!-- Mast -->
    <line x1="20" y1="30" x2="20" y2="100" stroke="#334155" stroke-width="3"/>
    <!-- Solar Panel -->
    <rect x="5" y="20" width="22" height="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1" rx="2" transform="rotate(-15 15 25)"/>
    <!-- Gateway Box -->
    <rect x="12" y="45" width="16" height="22" fill="#0f172a" rx="3"/>
    <!-- Omni Antenna -->
    <line x1="20" y1="45" x2="20" y2="10" stroke="#10b981" stroke-width="2.5"/>
    <!-- Radio Waves to Rovers -->
    <path d="M 10 10 A 15 15 0 0 0 10 25" stroke="#10b981" stroke-width="2" fill="none"/>
    <!-- Callout -->
    <rect x="-70" y="-35" width="140" height="32" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
    <text x="-62" y="-22" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#047857">4. SOLAR 4G GATEWAY</text>
    <text x="-62" y="-10" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">15 km Long-Range LoRa</text>
  </g>

  <!-- Mountain Road at Base -->
  <polygon points="50,480 350,380 500,430 150,480" fill="#334155"/>
  <line x1="80" y1="475" x2="330" y2="390" stroke="#f8fafc" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="180" y="445" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" transform="rotate(-23 180 445)">Main Mountain Highway</text>

  <!-- Key Takeaway Ribbon -->
  <g transform="translate(20, 20)">
    <rect width="320" height="42" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.05))"/>
    <circle cx="22" cy="21" r="10" fill="#ecfdf5"/>
    <path d="M 18 21 L 21 24 L 27 18" stroke="#10b981" stroke-width="2" fill="none"/>
    <text x="40" y="17" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#0f172a">Continuous Millimeter Tracking</text>
    <text x="40" y="32" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Early warning sent days before slope failure</text>
  </g>
</svg>
