<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="railSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="sleeperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <pattern id="ballastPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="3" fill="#64748b" fill-opacity="0.3"/>
      <circle cx="15" cy="15" r="2.5" fill="#475569" fill-opacity="0.3"/>
      <circle cx="15" cy="5" r="2" fill="#94a3b8" fill-opacity="0.3"/>
      <circle cx="5" cy="15" r="3.5" fill="#334155" fill-opacity="0.2"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#railSky)" rx="16"/>

  <!-- Ballast Bed (Crushed Stone Layer) -->
  <polygon points="0,480 0,320 800,320 800,480" fill="#94a3b8"/>
  <rect y="320" width="800" height="160" fill="url(#ballastPattern)"/>
  <text x="30" y="450" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#334155">BALLAST GRAVEL SUB-BASE (MONSOON EROSION ZONE)</text>

  <!-- Concrete Sleeper (Cross Tie) -->
  <rect x="100" y="270" width="600" height="65" rx="6" fill="url(#sleeperGrad)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="120" y="310" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#475569">Railway Sleeper (Cross Tie)</text>

  <!-- Left Steel Rail -->
  <g transform="translate(230, 160)">
    <!-- Rail Head -->
    <rect x="-15" y="0" width="30" height="16" rx="3" fill="url(#steelGrad)"/>
    <!-- Web -->
    <rect x="-6" y="16" width="12" height="60" fill="url(#steelGrad)"/>
    <!-- Foot / Base -->
    <polygon points="-28,110 28,110 18,76 -18,76" fill="url(#steelGrad)"/>
    <!-- Fastening Clip -->
    <rect x="-35" y="100" width="10" height="14" rx="2" fill="#0284c7"/>
    <rect x="25" y="100" width="10" height="14" rx="2" fill="#0284c7"/>
    <text x="-40" y="-10" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#0f172a">Left Running Rail</text>
  </g>

  <!-- Right Steel Rail -->
  <g transform="translate(570, 160)">
    <!-- Rail Head -->
    <rect x="-15" y="0" width="30" height="16" rx="3" fill="url(#steelGrad)"/>
    <!-- Web -->
    <rect x="-6" y="16" width="12" height="60" fill="url(#steelGrad)"/>
    <!-- Foot / Base -->
    <polygon points="-28,110 28,110 18,76 -18,76" fill="url(#steelGrad)"/>
    <!-- Fastening Clip -->
    <rect x="-35" y="100" width="10" height="14" rx="2" fill="#0284c7"/>
    <rect x="25" y="100" width="10" height="14" rx="2" fill="#0284c7"/>
    <text x="-45" y="-10" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#0f172a">Right Running Rail</text>
  </g>

  <!-- Track Gauge Arrow (1676 mm Broad Gauge in Sri Lanka) -->
  <line x1="230" y1="210" x2="570" y2="210" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="230" cy="210" r="3" fill="#0284c7"/>
  <circle cx="570" cy="210" r="3" fill="#0284c7"/>
  <rect x="345" y="196" width="110" height="24" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1"/>
  <text x="355" y="212" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#0284c7">Track Gauge &amp; Cant</text>

  <!-- Clamped Tiltmeter (Tilt-IR on Left Sleeper Shoulder) -->
  <g transform="translate(130, 220)">
    <!-- Mounting Bracket clamped around sleeper -->
    <rect x="0" y="40" width="55" height="14" fill="#0369a1" rx="2"/>
    <line x1="10" y1="54" x2="10" y2="75" stroke="#0284c7" stroke-width="3"/>
    <line x1="45" y1="54" x2="45" y2="75" stroke="#0284c7" stroke-width="3"/>
    <!-- Tiltmeter Enclosure (Die-Cast Aluminum) -->
    <rect x="8" y="15" width="38" height="25" rx="4" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.5"/>
    <!-- Internal Antenna Indicator -->
    <circle cx="27" cy="27" r="4" fill="#10b981"/>
    <!-- Micro-Angle Motion Arrows -->
    <path d="M 0 10 A 20 20 0 0 1 50 10" stroke="#38bdf8" stroke-width="2" fill="none"/>
    <!-- Callout Box -->
    <rect x="-80" y="-85" width="165" height="42" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <text x="-70" y="-70" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#0284c7">1. WIRELESS TILTMETER</text>
    <text x="-70" y="-57" font-family="system-ui, sans-serif" font-size="9" fill="#475569">Clamped to Sleeper (No Drilling)</text>
    <text x="-70" y="-46" font-family="system-ui, sans-serif" font-size="8" fill="#10b981">● 70g Train Shock Certified</text>
  </g>

  <!-- Low-Profile Rail GNSS Disk (Mounted Central on Sleeper) -->
  <g transform="translate(370, 235)">
    <!-- Flat Mounting Plate -->
    <rect x="0" y="30" width="60" height="8" rx="2" fill="#0f172a"/>
    <!-- Low-profile disk antenna -->
    <ellipse cx="30" cy="26" rx="26" ry="7" fill="#0284c7" stroke="#38bdf8" stroke-width="1"/>
    <!-- Callout Box -->
    <rect x="-40" y="-95" width="140" height="42" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="-30" y="-80" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#1e40af">2. LOW-PROFILE GNSS</text>
    <text x="-30" y="-67" font-family="system-ui, sans-serif" font-size="9" fill="#475569">Flush between rails</text>
    <text x="-30" y="-56" font-family="system-ui, sans-serif" font-size="8" fill="#2563eb">● Clears train undercarriages</text>
  </g>

  <!-- Passing Express Train Silhouette Above -->
  <g transform="translate(180, 50)" opacity="0.45">
    <rect x="0" y="0" width="440" height="75" rx="8" fill="#1e293b"/>
    <!-- Train Windows -->
    <rect x="30" y="18" width="40" height="28" rx="4" fill="#93c5fd"/>
    <rect x="90" y="18" width="40" height="28" rx="4" fill="#93c5fd"/>
    <rect x="150" y="18" width="40" height="28" rx="4" fill="#93c5fd"/>
    <rect x="210" y="18" width="40" height="28" rx="4" fill="#93c5fd"/>
    <rect x="270" y="18" width="40" height="28" rx="4" fill="#93c5fd"/>
    <rect x="330" y="18" width="40" height="28" rx="4" fill="#93c5fd"/>
    <text x="390" y="42" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">TRAIN</text>
    <!-- Motion Lines -->
    <line x1="-30" y1="25" x2="-5" y2="25" stroke="#64748b" stroke-width="2"/>
    <line x1="-50" y1="40" x2="-10" y2="40" stroke="#64748b" stroke-width="2"/>
  </g>

  <!-- Top Ribbon -->
  <g transform="translate(20, 20)">
    <rect width="320" height="42" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.05))"/>
    <circle cx="22" cy="21" r="10" fill="#eff6ff"/>
    <path d="M 18 21 L 21 24 L 27 18" stroke="#0284c7" stroke-width="2" fill="none"/>
    <text x="40" y="17" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#0f172a">Zero Track Disruption</text>
    <text x="40" y="32" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Installed in 15 mins during normal maintenance</text>
  </g>
</svg>
