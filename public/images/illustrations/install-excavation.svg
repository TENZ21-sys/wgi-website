<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="exSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#exSky)" rx="16"/>

  <!-- Ground Line & Surrounding Soil Mass -->
  <polygon points="0,480 0,160 380,160 380,480" fill="#94a3b8" fill-opacity="0.25"/>
  <text x="30" y="240" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#64748b">SURROUNDING URBAN GROUND</text>

  <!-- Adjacent Existing High-Rise Building (Left) -->
  <g transform="translate(40, 40)">
    <rect x="0" y="0" width="180" height="120" rx="4" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- Windows -->
    <rect x="20" y="20" width="25" height="20" fill="#93c5fd" rx="2"/>
    <rect x="60" y="20" width="25" height="20" fill="#93c5fd" rx="2"/>
    <rect x="100" y="20" width="25" height="20" fill="#93c5fd" rx="2"/>
    <rect x="140" y="20" width="25" height="20" fill="#93c5fd" rx="2"/>
    <rect x="20" y="60" width="25" height="20" fill="#93c5fd" rx="2"/>
    <rect x="60" y="60" width="25" height="20" fill="#93c5fd" rx="2"/>
    <rect x="100" y="60" width="25" height="20" fill="#93c5fd" rx="2"/>
    <rect x="140" y="60" width="25" height="20" fill="#93c5fd" rx="2"/>
    <!-- Structural Facade Tiltmeter -->
    <circle cx="160" cy="110" r="5" fill="#ef4444"/>
    <text x="10" y="-10" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#0f172a">Adjacent City High-Rise</text>
  </g>

  <!-- City Public Road (Between Building & Pit) -->
  <g transform="translate(240, 140)">
    <rect x="0" y="0" width="130" height="20" fill="#334155"/>
    <line x1="10" y1="10" x2="120" y2="10" stroke="#f8fafc" stroke-width="1.5" stroke-dasharray="8 6"/>
    <text x="30" y="-8" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#64748b">Public Street</text>
  </g>

  <!-- Deep Excavation Pit (Right) -->
  <polygon points="380,480 800,480 800,420 380,420" fill="#cbd5e1" stroke="#94a3b8"/>
  <text x="480" y="455" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#334155">DEEP BASEMENT FOUNDATION BASE (15m-30m DEPTH)</text>

  <!-- Secant Pile Retaining Wall / Diaphragm Wall -->
  <rect x="380" y="140" width="30" height="340" fill="url(#wallGrad)" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Chained Settlement Beams along Wall (Connected in Series) -->
  <!-- Beam 1 -->
  <g transform="translate(420, 170)">
    <line x1="0" y1="0" x2="0" y2="70" stroke="#0284c7" stroke-width="4"/>
    <circle cx="0" cy="0" r="4" fill="#0369a1"/>
    <circle cx="0" cy="70" r="4" fill="#0369a1"/>
    <!-- Sensor box on beam -->
    <rect x="5" y="25" width="22" height="18" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  </g>

  <!-- Beam 2 -->
  <g transform="translate(420, 240)">
    <line x1="0" y1="0" x2="0" y2="70" stroke="#0284c7" stroke-width="4"/>
    <circle cx="0" cy="70" r="4" fill="#0369a1"/>
    <!-- Sensor box on beam -->
    <rect x="5" y="25" width="22" height="18" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  </g>

  <!-- Beam 3 -->
  <g transform="translate(420, 310)">
    <line x1="0" y1="0" x2="0" y2="70" stroke="#0284c7" stroke-width="4"/>
    <circle cx="0" cy="70" r="4" fill="#0369a1"/>
    <!-- Sensor box on beam -->
    <rect x="5" y="25" width="22" height="18" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  </g>

  <!-- Wall Deflection Arrows (Lateral Bowing Toward Pit) -->
  <g transform="translate(395, 270)">
    <path d="M 0 0 Q 25 35 0 70" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="4 2" fill="none"/>
    <line x1="12" y1="35" x2="35" y2="35" stroke="#ef4444" stroke-width="2"/>
    <polygon points="35,35 27,31 27,39" fill="#ef4444"/>
    <text x="45" y="39" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#ef4444">Wall Lateral Bowing Risk</text>
  </g>

  <!-- Callouts -->
  <!-- Callout 1: Chained Beams -->
  <g transform="translate(480, 200)">
    <rect width="180" height="42" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <text x="12" y="16" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#0284c7">1. CHAINED SETTLEMENT BEAMS</text>
    <text x="12" y="29" font-family="system-ui, sans-serif" font-size="9" fill="#475569">Continuous mm settlement profile</text>
    <text x="12" y="39" font-family="system-ui, sans-serif" font-size="8" fill="#0284c7">● Connected along retaining wall</text>
  </g>

  <!-- Callout 2: Adjacent Building Tilt -->
  <g transform="translate(100, 185)">
    <rect width="170" height="42" rx="8" fill="#ffffff" stroke="#ef4444" stroke-width="1.5"/>
    <text x="12" y="16" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#dc2626">2. NEIGHBOR PROTECTION</text>
    <text x="12" y="29" font-family="system-ui, sans-serif" font-size="9" fill="#475569">Detects foundation settlement</text>
    <text x="12" y="39" font-family="system-ui, sans-serif" font-size="8" fill="#dc2626">● Prevents structural litigation</text>
  </g>

  <!-- Top Ribbon -->
  <g transform="translate(20, 20)">
    <rect width="320" height="42" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.05))"/>
    <circle cx="22" cy="21" r="10" fill="#eff6ff"/>
    <path d="M 18 21 L 21 24 L 27 18" stroke="#0284c7" stroke-width="2" fill="none"/>
    <text x="40" y="17" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#0f172a">Total Shoring Wall Security</text>
    <text x="40" y="32" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Instant alert if excavation causes soil movement</text>
  </g>
</svg>
