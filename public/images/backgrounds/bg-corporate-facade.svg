<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" fill="none">
  <defs>
    <linearGradient id="corpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.10"/>
      <stop offset="50%" stop-color="#f8fafc" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.08"/>
    </linearGradient>
    <pattern id="facadeLines" width="120" height="120" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="120" y2="0" stroke="#0284c7" stroke-width="0.5" stroke-opacity="0.12"/>
      <line x1="0" y1="0" x2="0" y2="120" stroke="#0284c7" stroke-width="0.5" stroke-opacity="0.12"/>
      <line x1="60" y1="0" x2="60" y2="120" stroke="#0ea5e9" stroke-width="0.5" stroke-opacity="0.08" stroke-dasharray="4 4"/>
    </pattern>
  </defs>
  <rect width="1440" height="900" fill="url(#corpGrad)"/>
  <rect width="1440" height="900" fill="url(#facadeLines)"/>
  <!-- Modern Engineering Architectural Angles -->
  <polygon points="1440,0 1200,0 800,900 1440,900" fill="#0284c7" fill-opacity="0.02"/>
  <polygon points="0,0 400,0 150,900 0,900" fill="#2563eb" fill-opacity="0.02"/>
  <line x1="200" y1="0" x2="700" y2="900" stroke="#0284c7" stroke-width="1.5" stroke-opacity="0.15"/>
  <line x1="450" y1="0" x2="950" y2="900" stroke="#0ea5e9" stroke-width="1" stroke-opacity="0.12"/>
</svg>
