<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" fill="none">
  <defs>
    <pattern id="dotMatrix" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#0284c7" fill-opacity="0.18"/>
    </pattern>
    <linearGradient id="sensorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.06"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="900" fill="url(#sensorGrad)"/>
  <rect width="1440" height="900" fill="url(#dotMatrix)"/>
  <!-- Circuit Traces & Bus Paths -->
  <path d="M 100 200 H 300 L 350 250 H 600" stroke="#0284c7" stroke-width="1.5" stroke-opacity="0.2" fill="none"/>
  <circle cx="600" cy="250" r="4" fill="#0284c7" fill-opacity="0.3"/>
  <path d="M 800 150 H 1000 L 1050 200 H 1300" stroke="#0ea5e9" stroke-width="1.5" stroke-opacity="0.2" fill="none"/>
  <circle cx="1300" cy="200" r="4" fill="#0ea5e9" fill-opacity="0.3"/>
  <path d="M 200 600 H 450 L 500 550 H 800" stroke="#2563eb" stroke-width="1.5" stroke-opacity="0.15" fill="none"/>
  <circle cx="800" cy="550" r="4" fill="#2563eb" fill-opacity="0.25"/>
</svg>
